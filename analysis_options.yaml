# Analyzer configuration — Fase 0 del plan de mejoras (ANALISIS_Y_PLAN_MEJORAS.md).
# Base: flutter_lints + reglas adicionales de seguridad y performance.
# CI corre `flutter analyze --fatal-infos`: cualquier issue rompe el build.

include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - tool/**

linter:
  rules:
    # ─── Seguridad / estabilidad ─────────────────────────
    unawaited_futures: true          # Futures olvidados ocultan errores async
    cancel_subscriptions: true       # StreamSubscription sin cancel = leak
    close_sinks: true                # Sinks/controllers sin close = leak
    avoid_print: true                # Usar debugPrint o un logger

    # ─── Performance ─────────────────────────────────────
    prefer_const_constructors: true
    prefer_const_literals_to_create_immutables: true
    prefer_const_declarations: true
